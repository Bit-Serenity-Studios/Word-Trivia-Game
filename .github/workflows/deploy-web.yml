name: Deploy web preview

on:
  push:
    branches:
      - main
      - master
      - claude/**
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --ci

      - name: Typecheck
        run: npm run typecheck

      - name: Validate content
        run: npm run validate:content

      - name: Build web
        run: npm run build:web

      - name: Add .nojekyll and SPA fallback
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    # GitHub Pages environments only accept the default branch by default,
    # so non-main pushes (feature branches, PR builds) would fail the deploy
    # job even when the build succeeded. Gate deploy on main/master; other
    # branches still get the full build verification above.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
